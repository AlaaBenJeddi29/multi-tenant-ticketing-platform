name: CI

# "on" = the events that trigger this workflow.
# We run CI when code is pushed to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# A workflow contains one or more jobs. Jobs run in parallel by default,
# each on its own fresh virtual machine.
jobs:
  # ---- Job 1: the backend (Express + Prisma + TypeScript) ----
  server:
    name: Server typecheck
    runs-on: ubuntu-latest

    # Every "run" command below executes inside the server/ folder.
    defaults:
      run:
        working-directory: server

    # The Prisma config reads DATABASE_URL. CI has no .env file, so we provide
    # a throwaway value. `prisma generate` does not connect to the database.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    # "steps" run in order, top to bottom, on the same machine.
    steps:
      # Download the repository into the runner's workspace.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install and cache Node.js. "cache: npm" reuses the npm download cache
      # between runs, keyed by the lockfile, so installs are much faster.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Clean, lockfile-exact install.
      - name: Install dependencies
        run: npm ci

      # The generated Prisma client is gitignored, so it must be created here
      # before TypeScript can resolve the imports from src/generated/prisma.
      - name: Generate Prisma client
        run: npx prisma generate

      # Compile-check the whole server without emitting output files.
      - name: Typecheck
        run: npx tsc --noEmit

  # ---- Job 2: the frontend (React + Vite + TypeScript) ----
  client:
    name: Client typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # "tsc -b" typechecks the client project references (app + node configs).
      - name: Typecheck
        run: npx tsc -b
