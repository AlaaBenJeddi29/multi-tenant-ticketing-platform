name: CI

# Run on pushes to main and on pull requests that target main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository. No secrets or write scopes needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref so only the latest commit is validated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Backend: Express + Prisma + TypeScript, with a disposable PostgreSQL ----
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-24.04

    # Every "run" command executes inside the server/ folder.
    defaults:
      run:
        working-directory: server

    # The Prisma CLI reads DATABASE_URL (prisma.config.ts) for generate/migrate,
    # and the integration suite reads TEST_DATABASE_URL. Both point at the
    # disposable service database below — never the developer's .env database.
    # These are throwaway CI-only credentials for an ephemeral, localhost-only
    # container, so they are not secrets.
    env:
      DATABASE_URL: postgresql://ticketing_test:ticketing_test@localhost:5432/ticketing_test
      TEST_DATABASE_URL: postgresql://ticketing_test:ticketing_test@localhost:5432/ticketing_test

    # An ephemeral PostgreSQL for integration tests. GitHub waits for the health
    # check to pass before any step runs, so migrations and tests only start once
    # the database is accepting connections.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketing_test
          POSTGRES_PASSWORD: ticketing_test
          POSTGRES_DB: ticketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing_test -d ticketing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The generated Prisma client is gitignored, so it must be created before
      # TypeScript can resolve imports from src/generated/prisma.
      - name: Generate Prisma client
        run: npx prisma generate

      # Apply the committed migrations to the empty CI database. Non-destructive.
      - name: Apply database migrations
        run: npx prisma migrate deploy

      # Compile-check production sources without emitting output.
      - name: Typecheck (production)
        run: npx tsc --noEmit

      # Compile-check the unit and integration test files (tsconfig.test.json).
      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

  # ---- Frontend: React + Vite + TypeScript ----
  client:
    name: Client (typecheck)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # "tsc -b" typechecks the client project references (app + node configs).
      - name: Typecheck
        run: npx tsc -b
